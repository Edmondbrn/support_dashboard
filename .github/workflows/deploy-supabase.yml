on:
  push: { branches: [main] }
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./supabase
    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # action checkout v6

      - uses: supabase/setup-cli@aa3515eac405eac768fa4a72147c22d88a283c7b
        name: Install supabase CLI
        with:
          version: latest

      - name: Link to cloud instance
        env:
          SUPABASE_ACCESS_TOKEN: ${{secrets.SUPABASE_ACCESS_TOKEN}}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{secrets.SUPABASE_ACCESS_TOKEN}}
        run: |
          supabase functions deploy resend --yes

      - name: Deploy secrets
        run: |
          echo "
          APP_BASE_URL=https://support-dashboard-ygd3-fawn.vercel.app
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RPC_RESEND_KEY=${{ secrets.RPC_RESEND_KEY }}
          " > .env
          export SUPABASE_ACCESS_TOKEN=${{secrets.SUPABASE_ACCESS_TOKEN}}
          supabase secrets set --env-file .env

      # demo project so the simplest choice is to db reset --linked (avoid conflicts)
      - name: Reset storage buckets
        env:
          SUPABASE_ACCESS_TOKEN: ${{secrets.SUPABASE_ACCESS_TOKEN}}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/reset-buckets.mjs

      - name: Reset instance content
        env:
          SUPABASE_ACCESS_TOKEN: ${{secrets.SUPABASE_ACCESS_TOKEN}}
        run: |
          supabase db reset --linked --yes
          supabase config push

      - name: Stop supabase
        run: supabase stop